<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937}.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:9px;border:1px solid #d8dee9;border-bottom:0;border-radius:10px 10px 0 0;background:#f8fafc;position:sticky;top:0;z-index:2}.toolbar button{min-width:36px;padding:7px 10px;border:1px solid #cbd5e1;border-radius:6px;background:white;cursor:pointer;font-size:14px}.toolbar button:hover{background:#edf2f7}.editor{min-height:420px;padding:20px;border:1px solid #d8dee9;border-radius:0 0 10px 10px;background:white;font-size:16px;line-height:1.75;outline:none;overflow-wrap:anywhere}.editor:empty:before{content:attr(data-placeholder);color:#98a2b3}.editor iframe{display:block;width:min(100%,720px);aspect-ratio:16/9;height:auto;margin:14px 0;border:0;border-radius:10px;background:#111}.editor img{max-width:100%}.editor a{color:#315a9c}.sep{width:1px;background:#d8dee9;margin:2px 3px}
</style></head><body>
<div class="toolbar">
 <button type="button" data-cmd="bold" title="굵게"><b>B</b></button><button type="button" data-cmd="italic" title="기울임"><i>I</i></button><button type="button" data-cmd="underline" title="밑줄"><u>U</u></button><span class="sep"></span>
 <button type="button" data-cmd="formatBlock" data-value="h2">제목</button><button type="button" data-cmd="formatBlock" data-value="p">본문</button><button type="button" data-cmd="insertUnorderedList">• 목록</button><button type="button" data-cmd="insertOrderedList">1. 목록</button><span class="sep"></span>
 <button type="button" id="link">링크</button><button type="button" id="youtube">▶ YouTube</button><button type="button" data-cmd="removeFormat">서식 제거</button>
</div>
<div id="editor" class="editor" contenteditable="true" data-placeholder="공부할 텍스트를 입력하거나 YouTube 영상을 삽입하세요."></div>
<script>
(function(){
var editor=document.getElementById('editor'),loaded=false,lastValue='',timer=null;
function post(type,extra){parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},extra||{}),'*')}
function resize(){setTimeout(function(){post('streamlit:setFrameHeight',{height:Math.max(520,document.body.scrollHeight+12)})},30)}
function send(){lastValue=editor.innerHTML;post('streamlit:setComponentValue',{value:lastValue,dataType:'json'});resize()}
function changed(){clearTimeout(timer);timer=setTimeout(send,250)}
function youtubeId(url){var m=String(url||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);return m?m[1]:''}
document.querySelectorAll('[data-cmd]').forEach(function(button){button.addEventListener('mousedown',function(e){e.preventDefault();editor.focus();document.execCommand(button.dataset.cmd,false,button.dataset.value||null);changed()})});
document.getElementById('link').onclick=function(){var url=prompt('연결할 URL을 입력하세요.','https://');if(!url)return;editor.focus();document.execCommand('createLink',false,url);changed()};
document.getElementById('youtube').onclick=function(){var url=prompt('YouTube 영상 URL을 입력하세요.');var id=youtubeId(url);if(!id){alert('올바른 YouTube URL을 입력해주세요.');return}editor.focus();var html='<iframe contenteditable="false" src="https://www.youtube-nocookie.com/embed/'+id+'" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe><p><br></p>';document.execCommand('insertHTML',false,html);changed()};
editor.addEventListener('input',changed);editor.addEventListener('blur',send);
window.addEventListener('message',function(event){if(!event.data||event.data.type!=='streamlit:render')return;var value=String((event.data.args||{}).value||'');if(!loaded||(!editor.matches(':focus')&&value!==lastValue)){editor.innerHTML=value;lastValue=value}loaded=true;resize()});
post('streamlit:componentReady',{apiVersion:1});resize();
})();
</script></body></html>
