<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;color:#1f2937}#text{white-space:pre-wrap;line-height:2.05;padding:22px;border:1px solid #d9dee8;border-radius:12px;background:#fff;min-height:220px;cursor:text;user-select:text!important;-webkit-user-select:text!important;touch-action:auto}mark{background:#ffe58f;border-radius:3px;padding:2px 0}.panel{margin-top:12px;padding:14px;border:1px solid #d9dee8;border-radius:10px;background:#f8fafc}.selected{font-weight:700;margin-bottom:8px}textarea,input{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px;padding:8px}textarea{min-height:70px}button{margin-top:8px;background:#315a9c;color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}.note{margin-top:9px;padding:10px;background:#fff8d8;border-left:4px solid #f1c84b;border-radius:5px}.remove{float:right;background:transparent;color:#9b2c2c;margin:0;padding:0 4px}.hint{color:#667085;margin-bottom:10px;font-size:14px}.fallback{margin-top:12px}.fallback summary{cursor:pointer;color:#315a9c}</style></head><body>
<div class="hint">메모할 부분을 드래그하세요. 선택되면 바로 아래에 메모 입력창이 열립니다.</div><div id="text"></div><div id="editor" class="panel" hidden><div id="selected" class="selected"></div><textarea id="memo" placeholder="선택한 부분에 대한 메모"></textarea><button id="add">하이라이트와 메모 추가</button></div><details class="fallback"><summary>드래그가 안 될 때 직접 선택하기</summary><div class="panel"><input id="manual" placeholder="하이라이트할 문구를 그대로 입력"><textarea id="manualMemo" placeholder="메모"></textarea><button id="manualAdd">직접 추가</button></div></details><div id="notes"></div>
<script>
let args={text:"",highlights:[]}, pending=null, initialized=false;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let hs=[...(args.highlights||[])].sort((a,b)=>a.start-b.start),out='',p=0;for(const h of hs){out+=esc(args.text.slice(p,h.start));out+='<mark>'+esc(args.text.slice(h.start,h.end))+'</mark>';p=h.end}out+=esc(args.text.slice(p));document.getElementById('text').innerHTML=out;document.getElementById('notes').innerHTML=hs.map((h,i)=>'<div class="note"><button class="remove" onclick="removeH('+i+')">삭제</button><b>'+esc(args.text.slice(h.start,h.end))+'</b><br>'+esc(h.note)+'</div>').join('');height()}
function offsets(range){const root=document.getElementById('text'),pre=document.createRange();pre.selectNodeContents(root);pre.setEnd(range.startContainer,range.startOffset);const start=pre.toString().length;return{start,end:start+range.toString().length}}
function captureSelection(){setTimeout(()=>{const s=window.getSelection();if(!s||!s.rangeCount||s.isCollapsed)return;const r=s.getRangeAt(0),root=document.getElementById('text');if(!root.contains(r.startContainer)||!root.contains(r.endContainer))return;pending={...offsets(r),text:r.toString()};if(!pending.text.trim())return;document.getElementById('selected').textContent='선택: '+pending.text;document.getElementById('editor').hidden=false;document.getElementById('memo').focus();height()},30)}
['mouseup','pointerup','touchend'].forEach(evt=>document.addEventListener(evt,captureSelection));
document.addEventListener('selectionchange',()=>{const s=window.getSelection();if(s&&!s.isCollapsed)captureSelection()});
document.getElementById('add').onclick=()=>{if(!pending)return;args.highlights.push({start:pending.start,end:pending.end,note:document.getElementById('memo').value});document.getElementById('memo').value='';document.getElementById('editor').hidden=true;send();render()};
document.getElementById('manualAdd').onclick=()=>{const phrase=document.getElementById('manual').value,start=args.text.indexOf(phrase);if(!phrase||start<0){alert('스크립트에서 선택 문구를 찾을 수 없습니다.');return}args.highlights.push({start:start,end:start+phrase.length,note:document.getElementById('manualMemo').value});document.getElementById('manual').value='';document.getElementById('manualMemo').value='';send();render()};
window.removeH=i=>{args.highlights.splice(i,1);send();render()};
function send(){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:JSON.stringify(args.highlights),dataType:'json'},'*')}
function height(){setTimeout(()=>parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:document.body.scrollHeight+10},'*'),10)}
window.addEventListener('message',e=>{if(e.data.type==='streamlit:render'){const newText=e.data.args.text||'';if(!initialized||newText!==args.text){try{args.highlights=JSON.parse(e.data.args.highlights||'[]')}catch{args.highlights=[]}}args.text=newText;initialized=true;render();parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*')}});
parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');height();

<html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937}.hint{color:#667085;font-size:14px;margin-bottom:10px}.script{white-space:pre-wrap;line-height:2.1;padding:22px;border:1px solid #d9dee8;border-radius:12px;background:#fff;min-height:220px;cursor:text;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}.script::selection,.source::selection,.source *::selection{background:#a9cdfd}.source{white-space:pre-wrap}.highlight{background:#ffe16b;border-radius:3px}.editor,.note{display:block;white-space:normal;line-height:1.45;margin:8px 0 12px;padding:12px;border-radius:9px;background:#fff8d8;border-left:4px solid #e8bb2e}.editor textarea{display:block;width:100%;min-height:76px;padding:9px;border:1px solid #cbd5e1;border-radius:7px;background:white;font:inherit;resize:vertical}.editor button,.note button{margin:9px 6px 0 0;padding:8px 12px;border:0;border-radius:7px;cursor:pointer}.primary{background:#315a9c;color:#fff}.secondary{background:#e9edf3;color:#475467}
</style></head><body><main id="sh-v7-root"></main><script>
(function(){
  if(window.__shV7Started){parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');return}
  window.__shV7Started=true;
  var root=document.getElementById('sh-v7-root'),state={text:'',highlights:[]},pending=null,ready=false;
  function height(){setTimeout(function(){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:document.body.scrollHeight+12},'*')},10)}
  function send(){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:JSON.stringify(state.highlights),dataType:'json'},'*')}
  function el(tag,className,text){var node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
  function sourceNode(text,start,highlighted){var node=el(highlighted?'mark':'span',highlighted?'source highlight':'source',text);node.setAttribute('data-start',String(start));return node}
  function makeEditor(){var box=el('span','editor'),area=el('textarea');area.placeholder='선택한 부분에 대한 메모';var save=el('button','primary','메모 저장'),cancel=el('button','secondary','취소');save.type=cancel.type='button';save.addEventListener('mousedown',function(e){e.preventDefault();e.stopPropagation()});cancel.addEventListener('mousedown',function(e){e.preventDefault();e.stopPropagation()});save.addEventListener('click',function(e){e.stopPropagation();if(!pending)return;state.highlights.push({start:pending.start,end:pending.end,note:area.value});pending=null;send();render()});cancel.addEventListener('click',function(e){e.stopPropagation();pending=null;render()});box.append(area,save,cancel);setTimeout(function(){area.focus({preventScroll:true});area.scrollIntoView({behavior:'smooth',block:'center'})},30);return box}
  function makeNote(h,index){var box=el('span','note',h.note||'메모 없음'),remove=el('button','secondary','하이라이트 삭제');remove.type='button';remove.addEventListener('mousedown',function(e){e.preventDefault();e.stopPropagation()});remove.addEventListener('click',function(e){e.stopPropagation();state.highlights.splice(index,1);send();render()});box.append(el('br'),remove);return box}
  function render(){root.replaceChildren();root.append(el('div','hint','메모할 부분을 드래그하세요. 선택한 위치 바로 아래에 메모 입력창이 나타납니다.'));var script=el('div','script'),items=state.highlights.map(function(h,i){return{start:Number(h.start),end:Number(h.end),note:h.note||'',index:i,temp:false}});if(pending)items.push({start:pending.start,end:pending.end,note:'',index:-1,temp:true});items.sort(function(a,b){return a.start-b.start});var p=0;items.forEach(function(h){if(h.start<p||h.start<0||h.end>state.text.length)return;script.append(sourceNode(state.text.slice(p,h.start),p,false));script.append(sourceNode(state.text.slice(h.start,h.end),h.start,true));script.append(h.temp?makeEditor():makeNote(h,h.index));p=h.end});script.append(sourceNode(state.text.slice(p),p,false));root.append(script);script.addEventListener('mouseup',selectAfterMouse);script.addEventListener('touchend',selectAfterTouch);height()}
  function offset(node,amount){var target=node.nodeType===3?node.parentElement:node;var source=target&&target.closest?target.closest('.source'):null;if(!source)return null;return Number(source.getAttribute('data-start'))+amount}
  function selectedRange(){var selection=window.getSelection();if(!selection||selection.rangeCount===0||selection.isCollapsed)return null;var range=selection.getRangeAt(0),script=root.querySelector('.script');if(!script||!script.contains(range.startContainer)||!script.contains(range.endContainer))return null;var control=(range.startContainer.parentElement||range.startContainer);if(control.closest&&control.closest('.editor,.note'))return null;var start=offset(range.startContainer,range.startOffset),end=offset(range.endContainer,range.endOffset);if(start===null||end===null||start===end)return null;if(start>end){var tmp=start;start=end;end=tmp}return{start:start,end:end}}
  function acceptSelection(){var chosen=selectedRange();if(!chosen)return;pending=chosen;var selection=window.getSelection();if(selection)selection.removeAllRanges();render()}
  function selectAfterMouse(e){if(e.target.closest&&e.target.closest('.editor,.note,button,textarea'))return;setTimeout(acceptSelection,80)}
  function selectAfterTouch(e){if(e.target.closest&&e.target.closest('.editor,.note,button,textarea'))return;setTimeout(acceptSelection,250)}
  function receive(e){if(!e.data||e.data.type!=='streamlit:render')return;var incoming=e.data.args||{},newText=String(incoming.text||'');if(!ready||newText!==state.text){var raw=incoming.highlights||'[]';try{state.highlights=typeof raw==='string'?JSON.parse(raw):raw;if(!Array.isArray(state.highlights))state.highlights=[]}catch(error){state.highlights=[]}}state.text=newText;pending=null;ready=true;render()}
  window.addEventListener('message',receive);
  parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');
})();
</script></body></html>
