<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;color:#1f2937}#text{white-space:pre-wrap;line-height:2.05;padding:22px;border:1px solid #d9dee8;border-radius:12px;background:#fff;min-height:220px}mark{background:#ffe58f;border-radius:3px;padding:2px 0}.panel{margin-top:12px;padding:14px;border:1px solid #d9dee8;border-radius:10px;background:#f8fafc}.selected{font-weight:700;margin-bottom:8px}textarea{width:100%;box-sizing:border-box;min-height:70px;border:1px solid #cbd5e1;border-radius:8px;padding:8px}button{margin-top:8px;background:#315a9c;color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}.note{margin-top:9px;padding:10px;background:#fff8d8;border-left:4px solid #f1c84b;border-radius:5px}.remove{float:right;background:transparent;color:#9b2c2c;margin:0;padding:0 4px}.hint{color:#667085;margin-bottom:10px;font-size:14px}</style></head><body>
<div class="hint">메모할 부분을 드래그한 뒤 아래에 메모를 입력하세요.</div><div id="text"></div><div id="editor" class="panel" hidden><div id="selected" class="selected"></div><textarea id="memo" placeholder="선택한 부분에 대한 메모"></textarea><button id="add">하이라이트와 메모 추가</button></div><div id="notes"></div>
<script>
let args={text:"",highlights:[]}, pending=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let hs=[...(args.highlights||[])].sort((a,b)=>a.start-b.start),out='',p=0;for(const h of hs){out+=esc(args.text.slice(p,h.start));out+='<mark>'+esc(args.text.slice(h.start,h.end))+'</mark>';p=h.end}out+=esc(args.text.slice(p));document.getElementById('text').innerHTML=out;document.getElementById('notes').innerHTML=hs.map((h,i)=>'<div class="note"><button class="remove" onclick="removeH('+i+')">삭제</button><b>'+esc(args.text.slice(h.start,h.end))+'</b><br>'+esc(h.note)+'</div>').join('');height()}
function offsets(range){const root=document.getElementById('text'),pre=document.createRange();pre.selectNodeContents(root);pre.setEnd(range.startContainer,range.startOffset);const start=pre.toString().length;return{start,end:start+range.toString().length}}
document.getElementById('text').addEventListener('mouseup',()=>{const s=window.getSelection();if(!s.rangeCount||s.isCollapsed)return;const r=s.getRangeAt(0);if(!document.getElementById('text').contains(r.commonAncestorContainer))return;pending={...offsets(r),text:r.toString()};document.getElementById('selected').textContent='선택: '+pending.text;document.getElementById('editor').hidden=false;height()});
document.getElementById('add').onclick=()=>{if(!pending)return;args.highlights.push({start:pending.start,end:pending.end,note:document.getElementById('memo').value});document.getElementById('memo').value='';document.getElementById('editor').hidden=true;send();render()};
window.removeH=i=>{args.highlights.splice(i,1);send();render()};
function send(){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:JSON.stringify(args.highlights)},'*')}
function height(){setTimeout(()=>parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:document.body.scrollHeight+10},'*'),10)}
window.addEventListener('message',e=>{if(e.data.type==='streamlit:render'){args.text=e.data.args.text||'';try{args.highlights=JSON.parse(e.data.args.highlights||'[]')}catch{args.highlights=[]}render();parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*')}});
parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');height();
</script></body></html>
