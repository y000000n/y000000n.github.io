<!doctype html><!-- SCRIPT_HIGHLIGHTER_V11 -->
<html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937}.hint{color:#667085;font-size:14px;margin:0 0 10px}.selector{display:block;width:100%;min-height:420px;padding:22px;border:1px solid #d9dee8;border-radius:12px;background:#fff;color:#1f2937;font:16px/2.1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:none;user-select:none;touch-action:pan-y;cursor:text}.char{border-radius:2px}.char.dragging{background:#ffe16b}.review{white-space:pre-wrap;line-height:2.1;padding:22px;border:1px solid #d9dee8;border-radius:12px;background:#fff;min-height:220px}.annotation{display:inline-flex;flex-direction:column;vertical-align:top;max-width:100%;white-space:normal;margin:0 2px}.annotation .highlight{align-self:flex-start;white-space:pre-wrap}.highlight{background:#ffe16b;border-radius:3px}.editor,.note{display:block;width:max-content;max-width:min(420px,calc(100vw - 80px));white-space:normal;overflow-wrap:anywhere;line-height:1.45;margin:5px 0 7px;padding:9px 11px;border-radius:9px;background:#fff8d8;border-left:4px solid #e8bb2e}.editor{width:min(320px,calc(100vw - 80px))}.editor textarea{display:block;width:100%;min-height:76px;padding:9px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;font:inherit;resize:vertical}.btn{margin:9px 6px 4px 0;padding:9px 13px;border:0;border-radius:7px;cursor:pointer}.primary{background:#315a9c;color:#fff}.secondary{background:#e9edf3;color:#475467}.add{margin-bottom:12px}
</style></head><body><main id="v11-root"></main><script>
(function(){
if(window.__highlighterV11){parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');return}window.__highlighterV11=true;
var root=document.getElementById('v11-root'),state={text:'',highlights:[]},pending=null,loaded=false;
function node(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function frameHeight(){setTimeout(function(){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:document.body.scrollHeight+12},'*')},20)}
function send(){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:state.highlights,dataType:'json'},'*')}
function renderSelector(){pending=null;root.replaceChildren();root.append(node('p','hint','본문에서 원하는 범위를 드래그하세요. 선택 범위를 앱이 직접 표시합니다.'));var area=node('div','selector'),anchor=-1,current=-1,dragging=false,finishTimer=null;area.setAttribute('role','textbox');area.setAttribute('aria-label','복습 스크립트 본문');state.text.split('').forEach(function(ch,i){var span=node('span','char',ch);span.dataset.index=String(i);area.append(span)});function paint(){var lo=Math.min(anchor,current),hi=Math.max(anchor,current);area.querySelectorAll('.char').forEach(function(span,i){span.classList.toggle('dragging',dragging&&i>=lo&&i<=hi)})}function indexAt(x,y){var hit=document.elementFromPoint(x,y);var span=hit&&hit.closest?hit.closest('.char'):null;return span&&area.contains(span)?Number(span.dataset.index):-1}function start(e){var i=indexAt(e.clientX,e.clientY);if(i<0)return;e.preventDefault();clearTimeout(finishTimer);dragging=true;anchor=current=i;paint()}function move(e){if(!dragging)return;var i=indexAt(e.clientX,e.clientY);if(i<0)return;e.preventDefault();current=i;paint();clearTimeout(finishTimer);finishTimer=setTimeout(function(){finish()},650)}function finish(e){if(!dragging)return;clearTimeout(finishTimer);if(e&&e.cancelable)e.preventDefault();dragging=false;var start=Math.min(anchor,current),end=Math.max(anchor,current)+1;if(end<=start)return;pending={start:start,end:end};renderReview()}area.addEventListener('pointerdown',start);area.addEventListener('pointermove',move);area.addEventListener('pointerup',finish);area.addEventListener('pointercancel',finish);document.addEventListener('pointerup',finish);document.addEventListener('mouseup',finish);document.addEventListener('touchend',finish,{passive:false});window.addEventListener('blur',finish);root.append(area);frameHeight()}
function editor(){var box=node('span','editor'),memo=node('textarea');memo.placeholder='선택한 부분에 대한 메모';memo.value=pending&&pending.note?pending.note:'';memo.addEventListener('input',function(){if(pending)pending.note=memo.value});var save=node('button','btn primary','메모 저장'),cancel=node('button','btn secondary','취소');save.type=cancel.type='button';save.onclick=function(){state.highlights.push({start:pending.start,end:pending.end,note:pending.note||memo.value});pending=null;send();renderReview()};cancel.onclick=function(){pending=null;renderSelector()};box.append(memo,save,cancel);setTimeout(function(){memo.focus();memo.scrollIntoView({behavior:'smooth',block:'center'})},30);return box}
function savedNote(item,index){var box=node('span','note',item.note||'메모 없음'),remove=node('button','btn secondary','하이라이트 삭제');remove.type='button';remove.onclick=function(){state.highlights.splice(index,1);send();renderReview()};box.append(node('br'),remove);return box}
function renderReview(){root.replaceChildren();if(!pending){var add=node('button','btn primary add','새 하이라이트 추가');add.type='button';add.onclick=renderSelector;root.append(add)}var view=node('div','review'),items=state.highlights.map(function(h,i){return{start:Number(h.start),end:Number(h.end),note:h.note||'',index:i,temp:false}});if(pending)items.push({start:pending.start,end:pending.end,index:-1,temp:true});items.sort(function(a,b){return a.start-b.start});var p=0;items.forEach(function(item){if(item.start<p||item.start<0||item.end>state.text.length)return;view.append(document.createTextNode(state.text.slice(p,item.start)));var group=node('span','annotation');group.append(node('mark','highlight',state.text.slice(item.start,item.end)),item.temp?editor():savedNote(item,item.index));view.append(group);p=item.end});view.append(document.createTextNode(state.text.slice(p)));root.append(view);frameHeight()}
function receive(event){if(!event.data||event.data.type!=='streamlit:render')return;var args=event.data.args||{},text=String(args.text||'');if(!loaded||text!==state.text){var raw=args.highlights||'[]';try{state.highlights=typeof raw==='string'?JSON.parse(raw):raw;if(!Array.isArray(state.highlights))state.highlights=[]}catch(error){state.highlights=[]}}state.text=text;loaded=true;if(pending||state.highlights.length)renderReview();else renderSelector()}
window.addEventListener('message',receive);parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');
})();
</script></body></html>
